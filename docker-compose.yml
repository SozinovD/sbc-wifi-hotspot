services:
  sbc-wifi-hotspot:
    image: ghcr.io/sozinovd/sbc-wifi-hotspot:latest
    build: .
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      WIFI_INTERFACE: ${WIFI_INTERFACE:-wlan0}
      AP_SSID: ${AP_SSID:-SBC-Hotspot}
      AP_PASSPHRASE: ${AP_PASSPHRASE:-sbc-hotspot}
      AP_IP: ${AP_IP:-192.168.4.1}
      AP_CHANNEL: ${AP_CHANNEL:-6}
      AP_HW_MODE: ${AP_HW_MODE:-g}
      PORTAL_PORT: ${PORTAL_PORT:-80}
      CLIENT_WAIT_TIMEOUT: ${CLIENT_WAIT_TIMEOUT:-45}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-25}
      INTERNET_CHECK_URLS: ${INTERNET_CHECK_URLS:-}
      INTERNET_LOSS_RETRIES: ${INTERNET_LOSS_RETRIES:-5}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-30}
      AP_CLIENT_RETRY_INTERVAL: ${AP_CLIENT_RETRY_INTERVAL:-0}
      WIFI_COUNTRY: ${WIFI_COUNTRY:-00}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - hotspot-data:/data

volumes:
  hotspot-data:
